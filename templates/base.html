<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ВИННИ — доступ к цифровому сервису{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd',
              400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
              800: '#5b21b6', 900: '#4c1d95',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <style>
    body { background-image: radial-gradient(60rem 40rem at 80% -10%, rgba(124,58,237,.18), transparent), radial-gradient(50rem 30rem at 0% 0%, rgba(14,165,233,.12), transparent); }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans antialiased">

  {% include "partials/nav.html" %}

  <main class="flex-1 w-full">
    <div class="max-w-6xl mx-auto px-4 pt-6">
      {% include "partials/flash.html" %}
    </div>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  {% block scripts %}{% endblock %}
</body>
</html>
