<header class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur">
  <nav class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 font-extrabold text-lg tracking-tight">
      <span class="grid place-items-center w-9 h-9 rounded-xl bg-brand-600 text-white">В</span>
      <span>ВИННИ<span class="text-brand-400">.</span></span>
    </a>

    <div class="hidden md:flex items-center gap-6 text-sm text-slate-300">
      <a href="/#plans" class="hover:text-white transition-colors">Тарифы</a>
      <a href="/#download" class="hover:text-white transition-colors">Скачать</a>
      {% if user and user.role == 'admin' %}
        <a href="/admin" class="hover:text-white transition-colors">Админ-панель</a>
      {% endif %}
    </div>

    <div class="flex items-center gap-2">
      {% if user %}
        <a href="/dashboard" class="text-sm text-slate-300 hover:text-white px-3 py-2 transition-colors">Кабинет</a>
        <a href="/logout" class="text-sm rounded-lg border border-slate-700 hover:bg-slate-800 px-4 py-2 transition-colors">Выйти</a>
      {% else %}
        <a href="/login" class="text-sm text-slate-300 hover:text-white px-3 py-2 transition-colors">Войти</a>
        <a href="/register" class="text-sm rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-semibold px-4 py-2 transition-colors">Регистрация</a>
      {% endif %}
    </div>
  </nav>
</header>
