{% extends "base.html" %}

{% block title %}Вход — ВИННИ{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-8">
    <h1 class="text-2xl font-bold text-white">Вход</h1>
    <p class="mt-1 text-sm text-slate-400">Введите email и пароль от аккаунта.</p>

    <form method="post" action="/login" class="mt-6 space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1.5" for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-brand-500 transition-colors"
               placeholder="example@yandex.ru">
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1.5" for="password">Пароль</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-brand-500 transition-colors"
               placeholder="••••••••">
      </div>
      <button type="submit" class="w-full rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold px-4 py-3 transition-colors">
        Войти
      </button>
    </form>

    <p class="mt-5 text-sm text-slate-400">
      Нет аккаунта?
      <a href="/register" class="text-brand-400 hover:text-brand-300">Зарегистрироваться</a>
    </p>
  </div>
</section>
{% endblock %}
