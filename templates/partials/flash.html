{% if flashes %}
  <div class="space-y-2 mb-4">
    {% for f in flashes %}
      {% if f.category == 'success' %}
        <div class="rounded-xl border border-emerald-700/50 bg-emerald-900/30 text-emerald-200 px-4 py-3 text-sm">{{ f.message }}</div>
      {% elif f.category == 'error' %}
        <div class="rounded-xl border border-rose-700/50 bg-rose-900/30 text-rose-200 px-4 py-3 text-sm">{{ f.message }}</div>
      {% else %}
        <div class="rounded-xl border border-slate-700 bg-slate-800/60 text-slate-200 px-4 py-3 text-sm">{{ f.message }}</div>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
